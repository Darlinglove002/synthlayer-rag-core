[project]
name = "synthlayer-rag-core"
version = "0.1.0"
description = "Hybrid RAG core on a single PostgreSQL: pgvector + tsvector, RRF fusion, cross-encoder reranking, page-level citations, built-in eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "fastembed>=0.4,<1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
    "ruff>=0.5",
    "fpdf2>=2.7",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL with pgvector (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# T20: no print() in package code (use logging). CLIs that exist to print are exempted below.
select = ["E", "F", "I", "B", "UP", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["T201"]  # prints the evaluation report
"scripts/*" = ["T201"]  # smoke-test progress

[tool.mypy]
python_version = "3.11"
files = ["app", "eval", "scripts"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

# Libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*", "anthropic.*", "fpdf.*"]
ignore_missing_imports = true
