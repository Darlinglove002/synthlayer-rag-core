[project]
name = "synthlayer-rag-core"
version = "0.1.0"
description = "Hybrid RAG core on a single PostgreSQL: pgvector + tsvector, RRF fusion, cross-encoder reranking, page-level citations, built-in eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3,<1",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "pypdf>=4.2",
    "fastembed>=0.4,<1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
    "ruff>=0.5",
    "fpdf2>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL with pgvector (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
