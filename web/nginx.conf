server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 21m;   # API enforces its own 20 MB limit

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    proxy_pass http://api:8020/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;   # first query after start loads the ONNX models
  }

  location / {
    try_files $uri /index.html;
  }
}
