name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5444:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag" --health-interval 3s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: onnx-models-v1
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: Type check (mypy, config in pyproject.toml)
        run: mypy
      - run: pytest -q
        env:
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed
      - name: Retrieval eval (fails if hybrid_rerank hit@3 drops below 0.9)
        run: python -m eval.run_eval
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/RESULTS.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  stack:
    # The one-command promise: db + api + web come up together and answer a real question.
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait --wait-timeout 600
      - run: python scripts/smoke.py http://localhost:8030
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
